  <!-- Receipt lines -->
  <rect x="184" y="128" width="144" height="16" rx="4" fill="#e5e0d8"/>
  <rect x="184" y="168" width="120" height="12" rx="3" fill="#d4cfc6"/>
  <rect x="184" y="200" width="100" height="12" rx="3" fill="#d4cfc6"/>
  <rect x="184" y="232" width="130" height="12" rx="3" fill="#d4cfc6"/>

